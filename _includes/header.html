<header>
  <div class="logo">
    <a href="{{ site.github.url }}/"><img src="/assets/img/{{ site.icon.img }}" alt="{{ site.icon.alt }}" ></a>
    <a href="{{ site.github.url }}/">{{ site.title }}</a>
  </div>
  <nav>
    {% for item in site.data.settings.menu %}
      <a href="{{ site.github.url }}/{{ item.url }}">{{ item.name }}</a>
    {% endfor %}
  </nav>
</header>
