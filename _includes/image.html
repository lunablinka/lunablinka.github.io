<div class="image-container">
  {% if include.url %}
  <a href="{{ include.url }}" data-glightbox data-title="{{ include.alt }}">
  {% else %}
  <a href="{{ site.github.url }}/assets/img/{{ include.image }}" data-glightbox data-title="{{ include.alt }}">
  {% endif %}
    <img src="{{ site.github.url }}/assets/img/{{ include.image }}" alt="{{ include.alt }}" class="image">
    <div class="overlay">
      <div class="text">
        {{ include.alt }} <i class="fa" aria-hidden="true"></i>
      </div>
    </div>
  </a>
</div>
